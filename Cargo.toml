[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/scorpionTaj/encore"

[workspace.dependencies]
embed = { path = "crates/embed" }
i18n = { path = "crates/i18n" }
icons = { path = "crates/icons" }
music = { path = "crates/music" }
state = { path = "crates/state" }
storage = { path = "crates/storage" }
input = { path = "crates/input" }
router = { path = "crates/router" }
ui = { path = "crates/ui" }
views = { path = "crates/views" }

alsa = "0.11"
anyhow = "1.0"
ardftsrc = "0.4.4"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
flate2 = "1"
cpal = "0.18"
dirs = "7.0"
discord-rich-presence = "1.1"
deunicode = "1.6"
env_logger = "0.11"
fastrand = "2.5"
futures = "0.3"
fluent-bundle = "0.16"
gpui = { git = "https://github.com/sonorahq/gpui", rev = "5fc4ef6cd82dc1e5bfe8cb756d81a1cb3c6ca8ef" }
gpui_platform = { git = "https://github.com/sonorahq/gpui", rev = "5fc4ef6cd82dc1e5bfe8cb756d81a1cb3c6ca8ef", features = [
  "font-kit",
  # Metal shaders compile when the app starts, so building needs no full Xcode install.
  "runtime_shaders",
  "wayland",
  "x11",
] }
http = "1.3"
winresource = "0.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Power",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
interprocess = "2.4"
widestring = "1.2"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "tz-system",
  "tzdb-bundle-platform",
  "tzdb-zoneinfo",
] }
kakasi = "0.1"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
libc = "0.2"
lofty = "0.25"
log = "0.4"
moka = { version = "0.12.15", features = ["future", "sync"] }
mpris-server = "0.10"
notify = "8.2"
open = "5.4"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSAccessibility",
  "NSApplication",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSStatusItem",
  "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFString",
] }
objc2-io-kit = { version = "0.3", default-features = false, features = [
  "std",
  "pwr_mgt",
] }
ashpd = { version = "0.13", default-features = false, features = [
  "async-io",
  "inhibit",
  "settings",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "form",
  "json",
  "query",
  "rustls",
] }
qrcodegen = "1"
raw-window-handle = "0.6"
resvg = { version = "0.46", default-features = false }
ring = "0.17"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
rtrb = "0.3"
rusqlite = { version = "0.41" }
# Pinned exactly: a young crate, and the decoder every HE-AAC stream goes through.
rusty_aac = { version = "=1.1.1", default-features = false }
rustfft = "6.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_norway = "0.9"
sha2 = "0.11"
souvlaki = "0.8"
sys-locale = "0.3"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mkv", "ogg", "isomp4"] }
tempfile = "3.27"
tray-icon = { version = "0.26", default-features = false }
unic-langid = { version = "0.9", features = ["macros"] }
unicode-bidi = "0.3"
unicode-segmentation = "1.12"

percent-encoding = "2.3"
pulseaudio = "0.3.2"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "macros",
  "sync",
  "time",
] }
time = { version = "0.3.55", features = ["parsing"] }

[patch.crates-io]
rodio = { git = "https://github.com/RustAudio/rodio", rev = "880aaba54b00aead53651ed1ccbdb672d1375a95" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.ui]
debug = false
opt-level = 2

[profile.dev.package.views]
debug = false
opt-level = 2

[profile.dev.package."*"]
debug = false
opt-level = 2

# The audio path runs in real time, decoding, resampling and mixing every sample, so it is built
# fully optimised even in debug builds.
[profile.dev.package.music]
opt-level = 3

[profile.dev.package.rodio]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.ardftsrc]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.rusty_aac]
opt-level = 3
