name: android

# Builds the arm64-v8a APK when android/ changes on main. Pushing a tag such as android-v1.0.0 also
# publishes the APK as a GitHub release, kept off "latest" so the desktop updater never offers it.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: read the version
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: test "android-v$VERSION" = "$GITHUB_REF_NAME"

      - name: build the APK
        run: ./gradlew --no-daemon assembleRelease

      - name: collect the APK
        run: |
          apk="encore-$VERSION-arm64-v8a-release.apk"
          mkdir -p dist
          cp "app/build/outputs/apk/release/$apk" dist/
          (cd dist && sha256sum "$apk" > SHA256SUMS)
          echo "APK=$apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: encore-android-${{ env.VERSION }}
          path: android/dist/

      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/$APK" dist/SHA256SUMS \
            --title "Encore for Android $VERSION" \
            --notes "Encore for Android $VERSION, for 64-bit ARM phones (arm64-v8a)." \
            --latest=false
