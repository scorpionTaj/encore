name: android

# Builds the arm64-v8a APK when android/ changes. Releases are built by release.yml, which attaches
# the APK to the same v* release as the macOS disk image.
on:
  push:
    branches: [main]
    paths: ["android/**", "Cargo.toml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "Cargo.toml", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      # signed with the release key when the secrets reach this run, so the artifact installs over
      # a released copy; pull requests from forks get the debug key instead
      - name: build the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ENCORE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ENCORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ENCORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/encore.jks"
            export ENCORE_KEYSTORE="$RUNNER_TEMP/encore.jks"
          fi
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: encore-android
          path: android/app/build/outputs/apk/release/*.apk
