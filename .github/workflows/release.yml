name: release

# Pushing a tag such as v1.0.1 builds Encore for Apple Silicon and publishes a GitHub release with
# the disk image and its checksum. Installed copies of Encore update themselves from it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: check the tag matches the version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: build Encore.app
        run: ./scripts/bundle-macos.sh

      - name: make the disk image
        run: |
          image="Encore-$VERSION-macos-arm64.dmg"
          mkdir -p dist/image
          cp -R dist/Encore.app dist/image/
          ln -s /Applications dist/image/Applications
          hdiutil create -volname Encore -srcfolder dist/image -ov -format UDZO "dist/$image"
          (cd dist && shasum -a 256 "$image" > SHA256SUMS)
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$IMAGE" dist/SHA256SUMS \
            --title "Encore $VERSION" \
            --generate-notes
