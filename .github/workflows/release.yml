name: release

# Pushing a tag such as v1.0.1 builds Encore for Apple Silicon and publishes a GitHub release with
# the disk image and its checksum. Installed copies of Encore update themselves from it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: check the tag matches the version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: build Encore.app
        run: ./scripts/bundle-macos.sh

      - name: make the disk image
        run: |
          image="Encore-$VERSION-macos-arm64.dmg"
          ./scripts/make-dmg.sh "dist/$image"
          (cd dist && shasum -a 256 "$image" > SHA256SUMS)
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the notes are this version's section of CHANGELOG.md, which Encore shows in its
          # update card
          awk -v head="## [$VERSION]" '$0 == head { found = 1; next } /^## \[/ && found { exit } found' \
            CHANGELOG.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/$IMAGE" dist/SHA256SUMS \
            --title "Encore $VERSION" \
            --notes-file dist/notes.md
