name: release

# Pushing a tag such as v1.0.1 builds Encore for Apple Silicon Macs and arm64 Android phones and
# publishes one GitHub release with the disk image, the APK and their checksums. Installed copies of
# Encore on either platform update themselves from it.
#
# Running it by hand with a tag, such as v1.5.0, builds only the APK from the default branch and
# attaches it to that existing release, for a release that went out without one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release to attach the Android APK to, such as v1.5.0"
        required: true

permissions:
  contents: write

jobs:
  macos:
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: check the tag matches the version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: build Encore.app
        run: ./scripts/bundle-macos.sh

      - name: make the disk image
        run: |
          image="Encore-$VERSION-macos-arm64.dmg"
          ./scripts/make-dmg.sh "dist/$image"
          (cd dist && shasum -a 256 "$image" > SHA256SUMS)
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the notes are this version's section of CHANGELOG.md, which Encore shows in its
          # update card
          awk -v head="## [$VERSION]" '$0 == head { found = 1; next } /^## \[/ && found { exit } found' \
            CHANGELOG.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/$IMAGE" dist/SHA256SUMS \
            --title "Encore $VERSION" \
            --notes-file dist/notes.md

  android:
    needs: macos
    # a hand-run skips the macOS job, so run after it either succeeded or was skipped
    if: always() && (needs.macos.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: check the tag matches the version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' ../Cargo.toml | head -n 1)"
          test "v$version" = "$TAG"

      # every release must carry the same signing key, or Android refuses the update
      - name: build the APK with the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ENCORE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ENCORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ENCORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::set the ANDROID_KEYSTORE_BASE64 secret (see android/README.md)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/encore.jks"
          ENCORE_KEYSTORE="$RUNNER_TEMP/encore.jks" ./gradlew --no-daemon assembleRelease

      - name: attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          apk="Encore-$version-android-arm64.apk"
          cp "app/build/outputs/apk/release/encore-$version-arm64-v8a-release.apk" "$apk"
          gh release download "$TAG" --pattern SHA256SUMS --clobber
          # replace the APK's line rather than add a second one when the job runs again
          { grep -v " $apk\$" SHA256SUMS || true; sha256sum "$apk"; } > SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          gh release upload "$TAG" "$apk" SHA256SUMS --clobber
