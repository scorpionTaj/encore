<!doctype html>
<!-- The remote page the desktop serves on the local network. Its labels arrive in the app's
     language in place of the LABELS marker, and every request carries the page's own secret. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Encore</title>
<style>
  :root { --bg: #131218; --card: #201f27; --text: #f3f1fa; --muted: #a29fb3; --accent: #5b3df5; --on-accent: #ffffff; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f5fc; --card: #ffffff; --text: #1b1a22; --muted: #625f72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 420px; background: var(--card); border-radius: 24px; padding: 24px; }
  h1 { margin: 0 0 20px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  #title { font-size: 22px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  #artist { color: var(--muted); margin: 4px 0 0; overflow-wrap: anywhere; }
  .time { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 20px 0 4px; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
  button { border: 0; border-radius: 50%; width: 56px; height: 56px; background: transparent; color: var(--text);
    display: grid; place-items: center; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.main { width: 72px; height: 72px; background: var(--accent); color: var(--on-accent); }
  svg { width: 28px; height: 28px; fill: currentColor; }
  label { display: block; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1 id="heading"></h1>
  <p id="title"></p>
  <p id="artist"></p>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <div class="time"><span id="at">0:00</span><span id="length">0:00</span></div>
  <div class="controls">
    <button id="previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM9.5 12 19 5v14z"/></svg></button>
    <button id="toggle" class="main"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="toggle-icon" d="M8 5v14l11-7z"/></svg></button>
    <button id="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5l9.5 7L5 19z"/></svg></button>
  </div>
  <label for="volume" id="volume-label"></label>
  <input id="volume" type="range" min="0" max="100" value="100">
</main>
<script>
  const labels = {{LABELS}};
  const token = new URLSearchParams(location.search).get("token") || "";
  const PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";
  const $ = (id) => document.getElementById(id);
  let state = null, dragging = false;

  document.title = labels.title;
  $("heading").textContent = labels.title;
  $("previous").setAttribute("aria-label", labels.previous);
  $("next").setAttribute("aria-label", labels.next);
  $("volume-label").textContent = labels.volume;

  const clock = (ms) => {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  const send = (path, extra = "") =>
    fetch(path + "?token=" + encodeURIComponent(token) + extra, { method: "POST" }).then(refresh);

  function show() {
    const playing = state && state.playing;
    $("title").textContent = state && state.title ? state.title : labels.idle;
    $("artist").textContent = state ? state.artist : "";
    $("toggle-icon").setAttribute("d", playing ? PAUSE : PLAY);
    $("toggle").setAttribute("aria-label", playing ? labels.pause : labels.play);
    if (!state) return;
    $("length").textContent = clock(state.duration_ms);
    $("at").textContent = clock(state.position_ms);
    if (!dragging && state.duration_ms > 0) $("seek").value = Math.round(state.position_ms / state.duration_ms * 1000);
    if (document.activeElement !== $("volume")) $("volume").value = Math.round(state.volume * 100);
  }

  async function refresh() {
    try {
      const answer = await fetch("/api/state?token=" + encodeURIComponent(token), { cache: "no-store" });
      if (answer.ok) state = await answer.json();
    } catch (_) { /* the desktop is away; keep showing the last state */ }
    show();
  }

  $("toggle").onclick = () => send("/api/toggle");
  $("next").onclick = () => send("/api/next");
  $("previous").onclick = () => send("/api/previous");
  $("seek").oninput = () => { dragging = true; };
  $("seek").onchange = () => {
    dragging = false;
    if (state && state.duration_ms > 0) send("/api/seek", "&ms=" + Math.round($("seek").value / 1000 * state.duration_ms));
  };
  $("volume").onchange = () => send("/api/volume", "&level=" + ($("volume").value / 100));

  show();
  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
