[package]
name = "android-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The Rust-core spike: the desktop's playback engine as a library the Android app loads in debug
# builds. It is empty on every other platform, so desktop builds are unchanged.
[lib]
name = "encore_core"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
anyhow.workspace = true
jni.workspace = true
music.workspace = true
ndk-context.workspace = true
