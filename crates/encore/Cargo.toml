[package]
name = "encore"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# the gpui frame overlay and repaint wash, off in normal builds
profiler = ["gpui/profiler"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures.workspace = true
log.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
i18n.workspace = true
icons.workspace = true
music.workspace = true
state.workspace = true
storage.workspace = true
input.workspace = true
router.workspace = true
ui.workspace = true
views.workspace = true
reqwest.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt"] }
interprocess.workspace = true
image.workspace = true
tray-icon.workspace = true
block2.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "block2",
  "NSEvent",
  "NSToolbar",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { workspace = true, features = ["NSString"] }
raw-window-handle.workspace = true

[build-dependencies]
embed.workspace = true

